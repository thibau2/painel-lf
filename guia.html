<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Suas guias — L&F Gestão Contábil</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--line:#e2e8f0;--txt:#172033;--muted:#64748b;--azul:#1e4fa8;--azul2:#2563eb;--verde:#15803d;--vermelho:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--line:#243249;--txt:#e6edf8;--muted:#94a3b8;--azul:#93b4ff;--azul2:#60a5fa;--verde:#34d399;--vermelho:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;min-height:100vh}
header{background:linear-gradient(120deg,#0f2a5c,#1e4fa8);color:#fff;padding:22px 16px}
.wrap{max-width:560px;margin:auto}
.marca{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800}
header h1{margin:0;font-size:19px}header p{margin:2px 0 0;opacity:.75;font-size:13px}
main{padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.card h2{margin:0 0 2px;font-size:17px}.card .sub{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.arq{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.arq .nome{flex:1;min-width:0;font-weight:600;word-break:break-word}
.arq .nome small{display:block;font-weight:400;color:var(--muted)}
button{background:var(--azul2);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
button:disabled{opacity:.6;cursor:wait}
.ok{color:var(--verde);font-size:13px}
.msg{text-align:center;color:var(--muted);padding:28px 8px}.msg.erro{color:var(--vermelho)}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:18px}
</style></head><body>
<header><div class="wrap marca"><div class="logo">L&F</div><div><h1>L&F Gestão Contábil</h1><p>Guias para pagamento</p></div></div></header>
<main><div class="wrap">
  <div class="card" id="card"><div class="msg">Carregando…</div></div>
  <footer>Link pessoal e temporário. Em caso de dúvida, fale com o escritório.</footer>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient('https://kaafckkfhdgujimtjxfx.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthYWZja2tmaGRndWppbXRqeGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTk1NDMsImV4cCI6MjEwMjY5NTU0M30.lMXpVcf7Ex6tMXFpQR0wGDgrXNf96d0GqkfNbYkus24');
const card = document.getElementById('card');
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const token = new URLSearchParams(location.search).get('t') || '';
function rotulo(nome){ const p = nome.replace(/\.pdf$/i,'').split(' - '); return { titulo: p.length > 1 ? p.slice(1).join(' - ') : p[0], de: p.length > 1 ? p[0] : '' }; }
async function iniciar(){
  if (!/^[0-9a-f]{32}$/.test(token)) { card.innerHTML = '<div class="msg erro">Link inválido. Confira se o endereço foi copiado inteiro.</div>'; return; }
  const { data, error } = await sb.rpc('guia_abrir', { p_token: token });
  if (error) { card.innerHTML = '<div class="msg erro">Não foi possível carregar as guias agora. Tente de novo em instantes.</div>'; return; }
  if (!data) { card.innerHTML = '<div class="msg erro">Este link expirou. Peça ao escritório um novo envio.</div>'; return; }
  const comp = data.competencia ? data.competencia.slice(5) + '/' + data.competencia.slice(0, 4) : '';
  card.innerHTML = `<h2>${esc(data.empresa)}</h2><div class="sub">${comp ? 'Competência ' + comp + ' · ' : ''}${data.arquivos.length} guia(s)</div>`
    + data.arquivos.map((a, i) => { const r = rotulo(a.nome); return `<div class="arq"><div class="nome">${esc(r.titulo)}${r.de ? `<small>${esc(r.de)}</small>` : ''}<span class="ok" id="ok${i}"></span></div><button id="b${i}" onclick="baixar(${i})">Baixar PDF</button></div>`; }).join('');
  window.ARQS = data.arquivos;
}
async function baixar(i){
  const a = ARQS[i], b = document.getElementById('b' + i);
  b.disabled = true; b.textContent = 'Abrindo…';
  try {
    await sb.rpc('guia_baixou', { p_token: token, p_caminho: a.caminho });
    const { data, error } = await sb.storage.from('guias').download(a.caminho);
    if (error) throw error;
    const url = URL.createObjectURL(new Blob([data], { type: 'application/pdf' }));
    const link = document.createElement('a'); link.href = url; link.download = a.nome; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    document.getElementById('ok' + i).textContent = ' ✓ baixado';
  } catch (e) { alert('Não foi possível baixar agora. Tente de novo.'); }
  b.disabled = false; b.textContent = 'Baixar PDF';
}
iniciar();
</script></body></html>
